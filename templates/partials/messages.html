{% comment %}Flash message của django.contrib.messages. Class .flash được thêm
vào cả 3 file theme (khối "Bổ sung cho bản Django" cuối mỗi file).{% endcomment %}
{% if messages %}
  {% for m in messages %}
    <div class="flash{% if m.level_tag == 'error' %} error{% endif %}">{{ m }}</div>
  {% endfor %}
{% endif %}
