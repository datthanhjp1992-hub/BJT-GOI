admin.data.error.has_errors = Còn {count} dòng lỗi nên chưa ghi được gì. Sửa file rồi tải lại — ghi một nửa sẽ khiến lần nhập sau vừa trùng vừa thiếu.
admin.data.error.nothing_to_import = Không có dòng nào để ghi.
admin.data.error.no_key_for_update = Bảng này không có khoá tự nhiên nên không biết dòng nào cần cập nhật — chỉ dùng được chế độ thêm mới.
admin.data.error.session_expired = Phiên xem trước đã hết hạn hoặc không khớp — tải lại file rồi kiểm tra lại.
admin.data.error.changed_since_preview = Dữ liệu đã thay đổi kể từ lúc xem trước nên chưa ghi gì. Kiểm tra lại file.
admin.data.error.integrity = Cơ sở dữ liệu từ chối dữ liệu này nên đã huỷ toàn bộ lần nhập: {detail}


