# -- SC07b Nhập / xuất dữ liệu --
admin.data.hint.intro = Tải file mẫu, điền dữ liệu rồi tải lên. Mỗi lần nhập tối đa {max_rows} dòng và chỉ THÊM MỚI — không sửa, không xoá bản ghi nào. Sửa hoặc xoá từng dòng vẫn làm ở trang quản trị Django.
admin.data.hint.insert_only = Chế độ nhập: chỉ thêm dòng mới. Dòng đã có trong hệ thống sẽ bị bỏ qua, dữ liệu cũ giữ nguyên.
admin.data.hint.duplicate_key = Nhận biết dòng trùng theo: {fields}
admin.data.hint.no_duplicate_key = Bảng này không có khoá chống trùng nên mọi dòng đều được coi là mới — nhập cùng một file hai lần sẽ ra dữ liệu đôi.
