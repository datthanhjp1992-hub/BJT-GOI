# ERROR_REPORT (SC14) — báo cáo lỗi nội dung
# -----------------------------------------------------------------------------
error_report.form.hint.intro = Mô tả càng cụ thể thì lỗi càng nhanh được sửa — ghi rõ sai ở đâu và đúng phải là gì.
error_report.form.hint.target = Đang báo lỗi cho từ: {word}
error_report.validation.description_too_short = Mô tả lỗi cần ít nhất {min} ký tự — ghi rõ sai ở chỗ nào giúp quản trị viên xử lý nhanh hơn.
error_report.create.success = Đã gửi báo lỗi. Quản trị viên sẽ xem và phản hồi ngay tại trang này.
error_report.mine.empty = Bạn chưa gửi báo lỗi nào.
error_report.mine.hint.intro = Theo dõi trạng thái xử lý và phản hồi của quản trị viên cho các lỗi bạn đã báo.
error_report.admin.hint.intro = Lỗi nội dung do người học báo về. Sửa từ vựng ở Django admin rồi quay lại đánh dấu đã xử lý.
error_report.admin.empty = Không có báo lỗi nào ở trạng thái này.
error_report.admin.hint.dismiss_reason = Bỏ qua thì bắt buộc ghi lý do — người gửi sẽ đọc được phần phản hồi này.
error_report.action.success.fixed = Đã đánh dấu báo lỗi là ĐÃ SỬA.
error_report.action.success.dismissed = Đã bỏ qua báo lỗi này kèm lý do gửi cho người báo.
error_report.action.success.reopened = Đã mở lại báo lỗi, trạng thái quay về Chờ xử lý.
error_report.action.error.already_handled = Báo lỗi này đã được xử lý trước đó — mở lại trước nếu muốn thao tác tiếp.
error_report.action.error.already_pending = Báo lỗi này đang ở trạng thái Chờ xử lý.
error_report.action.error.reason_required = Vui lòng ghi lý do trước khi bỏ qua báo lỗi.
error_report.action.error.invalid = Thao tác không hợp lệ.

