admin.data.error.no_file = Chưa chọn file nào.
admin.data.error.file_too_large = File vượt quá {max_mb} MB — chia nhỏ rồi nhập từng phần.
admin.data.error.unsupported_format = Chỉ nhận file .csv, .xlsx hoặc .xlsm.
admin.data.error.empty_file = File không có dòng dữ liệu nào.
