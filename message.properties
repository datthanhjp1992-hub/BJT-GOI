# =============================================================================
# message.properties — Toàn bộ THÔNG BÁO của dự án BJT-GOI
# (lỗi validate, thông báo thành công, xác nhận, gợi ý/hint, thông báo hệ thống)
# =============================================================================
# QUY UOC (đọc kỹ trước khi thêm key mới):
#
# 1. KHÔNG hardcode chuỗi thông báo trong view/model/template. Luôn tra qua:
#      Python : apps.core.properties.message("contribution.approve.success", points=10)
#      Template: {% load properties_tags %}{% message "common.success.saved" %}
#
# 2. Cấu trúc key: "<scope>.<nhom>.<ten>" — CÙNG quy ước scope với
#    label.properties (xem file đó để biết danh sách scope: common, accounts,
#    vocabulary, learning, practice_sheets, contribution, badge, admin,
#    error_report).
#
# 3. <nhom> mô tả LOẠI message: validation / error / success / confirm / hint
#
# 4. Message có thể chứa placeholder dạng {ten_bien} — thay giá trị thật lúc
#    gọi: message("practice_sheets.upload.success", count=38, filename="x.xlsx")
#    Tên placeholder phải khớp CHÍNH XÁC (phân biệt hoa/thường) với tên
#    keyword argument truyền vào lúc gọi.
#
# 5. Message LỖI VALIDATE dùng chung (bắt buộc nhập, email sai định dạng...)
#    để ở "common.validation.*" — không tạo bản riêng cho từng form.
# =============================================================================


