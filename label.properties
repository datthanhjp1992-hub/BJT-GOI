# =============================================================================
# label.properties — Toàn bộ NHÃN hiển thị của dự án BJT-GOI
# (tiêu đề, tên trường nhập liệu, nút bấm, mục nav, tiêu đề cột bảng, tag...)
# =============================================================================
# QUY UOC (đọc kỹ trước khi thêm key mới):
#
# 1. KHÔNG hardcode chuỗi tiếng Việt trong view/model/template. Luôn tra qua:
#      Python : apps.core.properties.label("common.button.save")
#      Template: {% load properties_tags %}{% label "common.button.save" %}
#
# 2. Cấu trúc key: "<scope>.<nhom>.<ten>"
#      scope = "common"        -> LABEL DÙNG CHUNG nhiều màn hình/feature
#                                  (nút Lưu/Huỷ/Gửi, nav, field email/mật khẩu...)
#      scope = tên feature     -> LABEL RIÊNG chỉ dùng ở feature đó, KHÔNG
#                                  dùng lại ở nơi khác. Danh sách scope hiện có:
#                                    accounts        (SC01 SC02 SC08 SC09)
#                                    vocabulary      (SC05)
#                                    learning        (SC03 SC04 SC06)
#                                    practice_sheets (SC10)
#                                    contribution    (SC11 SC12 — góp ý & hòm thư)
#                                    badge           (SC13 — điểm & danh hiệu)
#                                    admin           (SC07 — trang quản trị)
#                                    error_report    (SC14 — báo cáo lỗi nội dung)
#
# 3. <nhom> mô tả LOẠI label, để dễ tìm: nav / button / field / title /
#    section / table / tag / tab / stat / link / hint
#
# 4. Nếu 1 label ĐÃ có trong "common", KHÔNG tạo lại bản riêng ở feature khác
#    — dùng thẳng key common đó (vd nút "Lưu" luôn là common.button.save, dù
#    xuất hiện ở màn Cài đặt hay màn Hòm thư góp ý).
#
# 5. File chỉ chứa NHÃN tĩnh (không đổi theo dữ liệu runtime). Chuỗi có nội
#    dung động (vd "Đã đọc được 38 từ") thuộc về message.properties.
# =============================================================================


